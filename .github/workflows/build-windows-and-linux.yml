name: Build Linux and Windows FFmpeg

on:
  workflow_dispatch:

jobs:
  build-linux-windows:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            yasm \
            nasm \
            pkg-config \
            git \
            mingw-w64 \
            mingw-w64-tools \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            g++-mingw-w64-i686 \
            zip

      - name: Clone and build libvpx for Linux
        run: |
          git clone --depth 1 --branch v1.14.1 https://chromium.googlesource.com/webm/libvpx libvpx-linux-source
          cd libvpx-linux-source
          ./configure \
            --prefix=$PWD/../libvpx-linux \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp9 \
            --enable-vp9-highbitdepth \
            --as=yasm
          make -j$(nproc)
          make install

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch release/7.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-source

      - name: Build Linux AMD64
        run: |
          cd ffmpeg-source
          PKG_CONFIG_PATH=$PWD/../libvpx-linux/lib/pkgconfig ./configure \
            --prefix=$PWD/../ffmpeg-linux-amd64 \
            --disable-everything \
            --enable-libvpx \
            --enable-indev=x11grab \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-decoder=vp9 \
            --enable-demuxer=rawvideo \
            --enable-encoder=libvpx_vp9 \
            --enable-protocol=pipe \
            --enable-muxer=webm \
            --enable-muxer=matroska \
            --enable-filter=scale \
            --enable-filter=format \
            --disable-doc \
            --disable-debug \
            --extra-cflags="-I$PWD/../libvpx-linux/include" \
            --extra-ldflags="-L$PWD/../libvpx-linux/lib"
          make -j$(nproc)
          make install
          strip ../ffmpeg-linux-amd64/bin/ffmpeg

      - name: Create Linux artifact zip
        run: |
          # Put both the ffmpeg binary and THIRD_PARTY_NOTICES.txt in the root of the zip
          zip -j ffmpeg-linux-amd64/bin/ffmpeg.zip ffmpeg-linux-amd64/bin/ffmpeg THIRD_PARTY_NOTICES.txt

      - name: Install libvpx for cross-compilation
        run: |
          # Build libvpx for Windows 64-bit
          git clone --depth 1 --branch v1.14.1 https://chromium.googlesource.com/webm/libvpx libvpx-source

          # Build for win64
          cd libvpx-source
          ./configure \
            --target=x86_64-win64-gcc \
            --prefix=$PWD/../libvpx-win64 \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp9 \
            --enable-vp9-highbitdepth
          make -j$(nproc)
          make install
          cd ..

          # Clean for win32 build
          cd libvpx-source
          make distclean
          ./configure \
            --target=x86-win32-gcc \
            --prefix=$PWD/../libvpx-win32 \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp9 \
            --enable-vp9-highbitdepth
          make -j$(nproc)
          make install

      - name: Build Windows 64-bit
        run: |
          cd ffmpeg-source
          make distclean || true
          PKG_CONFIG_PATH=$PWD/../libvpx-win64/lib/pkgconfig ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --prefix=$PWD/../ffmpeg-win64 \
            --disable-everything \
            --enable-libvpx \
            --enable-cross-compile \
            --enable-indev=dshow \
            --enable-indev=gdigrab \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-decoder=vp9 \
            --enable-demuxer=rawvideo \
            --enable-encoder=libvpx_vp9 \
            --enable-protocol=pipe \
            --enable-muxer=webm \
            --enable-muxer=matroska \
            --enable-filter=scale \
            --enable-filter=format \
            --disable-doc \
            --disable-debug \
            --extra-cflags="-I$PWD/../libvpx-win64/include" \
            --extra-ldflags="-L$PWD/../libvpx-win64/lib"
          make -j$(nproc)
          make install
          x86_64-w64-mingw32-strip ../ffmpeg-win64/bin/ffmpeg.exe

      - name: Create Windows 64-bit artifact zip
        run: |
          # Bundle the ffmpeg.exe and THIRD_PARTY_NOTICES.txt into a single zip
          zip -j ffmpeg-win64/bin/ffmpeg.zip ffmpeg-win64/bin/ffmpeg.exe THIRD_PARTY_NOTICES.txt

      - name: Build Windows 32-bit
        run: |
          cd ffmpeg-source
          make distclean
          PKG_CONFIG_PATH=$PWD/../libvpx-win32/lib/pkgconfig ./configure \
            --arch=x86 \
            --target-os=mingw32 \
            --cross-prefix=i686-w64-mingw32- \
            --prefix=$PWD/../ffmpeg-win32 \
            --disable-everything \
            --enable-libvpx \
            --enable-cross-compile \
            --enable-indev=dshow \
            --enable-indev=gdigrab \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-decoder=vp9 \
            --enable-demuxer=rawvideo \
            --enable-encoder=libvpx_vp9 \
            --enable-protocol=pipe \
            --enable-muxer=webm \
            --enable-muxer=matroska \
            --enable-filter=scale \
            --enable-filter=format \
            --disable-doc \
            --disable-debug \
            --extra-cflags="-I$PWD/../libvpx-win32/include" \
            --extra-ldflags="-L$PWD/../libvpx-win32/lib"
          make -j$(nproc)
          make install
          i686-w64-mingw32-strip ../ffmpeg-win32/bin/ffmpeg.exe

      - name: Create Windows 32-bit artifact zip
        run: |
          # Bundle the ffmpeg.exe and THIRD_PARTY_NOTICES.txt into a single zip
          zip -j ffmpeg-win32/bin/ffmpeg.zip ffmpeg-win32/bin/ffmpeg.exe THIRD_PARTY_NOTICES.txt

      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-linux-amd64
          path: |
            ffmpeg-linux-amd64/bin/ffmpeg.zip
          if-no-files-found: error

      - name: Upload Windows 64-bit artifact
        uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-win64
          path: |
            ffmpeg-win64/bin/ffmpeg.zip
          if-no-files-found: error

      - name: Upload Windows 32-bit artifact
        uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-win32
          path: |
            ffmpeg-win32/bin/ffmpeg.zip
          if-no-files-found: error