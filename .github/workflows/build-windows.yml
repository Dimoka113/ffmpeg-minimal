name: Build Windows

on:
  workflow_dispatch:
    inputs:
      capture_device:
        description: "Screen capture device to use"
        required: true
        default: "gdigrab"
        type: choice
        options:
          - ddagrab
          - gdigrab

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            arch: x86_64
            artifact_name: ffmpeg-win64
          - msystem: MINGW32
            arch: i686
            artifact_name: ffmpeg-win32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            mingw-w64-${{ matrix.arch }}-gcc
            mingw-w64-${{ matrix.arch }}-yasm
            mingw-w64-${{ matrix.arch }}-nasm
            mingw-w64-${{ matrix.arch }}-pkg-config
            git

      - name: Build libvpx
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch v1.14.1 https://chromium.googlesource.com/webm/libvpx
          cd libvpx
          ./configure \
            --prefix=/mingw${{ matrix.arch == 'x86_64' && '64' || '32' }} \
            --target=${{ matrix.arch == 'x86_64' && 'x86_64-win64-gcc' || 'x86-win32-gcc' }} \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp9 \
            --enable-vp9-highbitdepth
          make -j$(nproc)
          make install

      - name: Build FFmpeg
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch release/7.1 https://git.ffmpeg.org/ffmpeg.git
          cd ffmpeg
          ./configure \
            --prefix=$PWD/../output \
            --disable-everything \
            --enable-libvpx \
            --enable-indev=dshow \
            --enable-indev=${{ github.event.inputs.capture_device }} \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-decoder=vp9 \
            --enable-demuxer=rawvideo \
            --enable-encoder=libvpx_vp9 \
            --enable-protocol=pipe \
            --enable-muxer=webm \
            --enable-muxer=matroska \
            --enable-filter=scale \
            --enable-filter=format \
            --disable-doc \
            --disable-debug
          make -j$(nproc)
          make install
          strip ../output/bin/ffmpeg.exe

      - name: Create Windows artifact zip
        shell: pwsh
        run: |
          # Copy binary and license into a temp folder so they are at the root of the zip
          New-Item -Path tmpzip -ItemType Directory -Force | Out-Null
          Copy-Item -Path output/bin/ffmpeg.exe -Destination tmpzip
          Copy-Item -Path THIRD_PARTY_NOTICES.txt -Destination tmpzip
          Compress-Archive -Path tmpzip\* -DestinationPath output/bin/ffmpeg.zip -Force
          Remove-Item -Recurse -Force tmpzip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}-${{ github.event.inputs.capture_device }}
          path: |
            output/bin/ffmpeg.zip
          if-no-files-found: error
