name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install yasm nasm pkg-config

      - name: Clone and build libvpx
        run: |
          git clone --depth 1 --branch v1.14.1 https://chromium.googlesource.com/webm/libvpx libvpx-source
          cd libvpx-source
          ./configure \
            --prefix=$PWD/../libvpx-install \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp9 \
            --enable-vp9-highbitdepth
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch release/7.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-source

      - name: Build macOS Intel
        run: |
          cd ffmpeg-source
          PKG_CONFIG_PATH=$PWD/../libvpx-install/lib/pkgconfig ./configure \
            --prefix=$PWD/../ffmpeg-macos-intel \
            --disable-everything \
            --enable-libvpx \
            --enable-indev=avfoundation \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-decoder=vp9 \
            --enable-demuxer=rawvideo \
            --enable-encoder=libvpx_vp9 \
            --enable-protocol=pipe \
            --enable-muxer=webm \
            --enable-muxer=matroska \
            --enable-filter=scale \
            --enable-filter=format \
            --disable-doc \
            --disable-debug \
            --extra-cflags="-I$PWD/../libvpx-install/include" \
            --extra-ldflags="-L$PWD/../libvpx-install/lib"
          make -j$(sysctl -n hw.ncpu)
          make install
          strip ../ffmpeg-macos-intel/bin/ffmpeg

      - name: Create macOS Intel artifact zip
        run: |
          # Put both the ffmpeg binary and THIRD_PARTY_NOTICES.txt in the root of the zip
          zip -j ffmpeg-macos-intel/bin/ffmpeg.zip ffmpeg-macos-intel/bin/ffmpeg THIRD_PARTY_NOTICES.txt

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-macos-intel
          path: |
            ffmpeg-macos-intel/bin/ffmpeg.zip
          if-no-files-found: error
          retention-days: 1

  build-macos-arm64:
    runs-on: macos-latest  # Apple Silicon runner
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install yasm nasm pkg-config

      - name: Clone and build libvpx
        run: |
          git clone --depth 1 --branch v1.14.1 https://chromium.googlesource.com/webm/libvpx libvpx-source
          cd libvpx-source
          ./configure \
            --prefix=$PWD/../libvpx-install \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp9 \
            --enable-vp9-highbitdepth
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch release/7.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-source

      - name: Build macOS Apple Silicon
        run: |
          cd ffmpeg-source
          PKG_CONFIG_PATH=$PWD/../libvpx-install/lib/pkgconfig ./configure \
            --prefix=$PWD/../ffmpeg-macos-arm64 \
            --disable-everything \
            --enable-libvpx \
            --enable-indev=avfoundation \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-decoder=vp9 \
            --enable-encoder=libvpx_vp9 \
            --enable-protocol=pipe \
            --enable-muxer=webm \
            --enable-muxer=matroska \
            --enable-filter=scale \
            --enable-filter=format \
            --disable-doc \
            --disable-debug \
            --extra-cflags="-I$PWD/../libvpx-install/include" \
            --extra-ldflags="-L$PWD/../libvpx-install/lib"
          make -j$(sysctl -n hw.ncpu)
          make install
          strip ../ffmpeg-macos-arm64/bin/ffmpeg

      - name: Create macOS Apple Silicon artifact zip
        run: |
          zip -j ffmpeg-macos-arm64/bin/ffmpeg.zip ffmpeg-macos-arm64/bin/ffmpeg THIRD_PARTY_NOTICES.txt

      - name: Upload macOS Apple Silicon artifact
        uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-macos-arm64
          path: |
            ffmpeg-macos-arm64/bin/ffmpeg.zip
          if-no-files-found: error
          retention-days: 1
